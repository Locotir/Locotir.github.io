name: Manage Gists

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  gist_management:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Verify Secrets
      run: |
        if [ -z "${{ secrets.TOKEN }}" ]; then echo "TOKEN is not set"; else echo "TOKEN is set"; fi
        if [ -z "${{ secrets.GIST_ID }}" ]; then echo "GIST_ID is not set"; else echo "GIST_ID is set"; fi

    - name: Run Gist Management Script
      run: |
        python .github/workflows/manage_gist.py --token "${{ secrets.TOKEN }}" --id "${{ secrets.GIST_ID }}"
